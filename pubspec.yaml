name: pocket_ssh
description: SSH client and interactive terminal.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  dartssh2: ^4.1.0
  xterm2: ^5.4.0
  xterm2_core: ^1.0.0
  flutter_secure_storage: ^9.2.4
  file_selector: ^1.0.3
  local_auth: ^2.3.0
  wakelock_plus: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
